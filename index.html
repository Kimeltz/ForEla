<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Elaaa!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ASCII Rain Container -->
        <div class="ascii-rain-container" id="rainContainer"></div>

        <!-- Countdown -->
        <div class="countdown-display" id="countdownDisplay"></div>

        <!-- Text Sequence Container -->
        <div class="text-sequence-container">
            <div class="text-item" id="text-hbd">Happy Birthday</div>
            <div class="text-item" id="text-ela">Elaaaa</div>
            <div class="text-item" id="text-wish">Wish</div>
            <div class="text-item" id="text-you">You</div>
            <div class="text-item" id="text-are">Are</div>
            <div class="text-item" id="text-the">The</div>
            <div class="text-item" id="text-best">Best</div>
        </div>

        <!-- ASCII Heart Container -->
        <div class="heart-container" id="heartContainer"></div>

        <!-- Audio -->
        <audio id="bgAudio" loop>
            <source src="assets/music.m4a" type="audio/m4a">
        </audio>
    </div>
    <script src="script.js"></script>
</body>
</html>
